<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tìm Xe Máy BLE</title>
  
  <!-- Khai báo Icon Ứng dụng từ file upload -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      background: #000000; 
      color: #ffffff; 
      text-align: center; 
      padding: 20px; 
      margin: 0; 
    }
    
    h2 {
      letter-spacing: 1px;
      margin-bottom: 30px;
    }

    .radar-box { 
      margin: 25px auto; 
      width: 240px; 
      height: 240px; 
      border-radius: 50%; 
      border: 4px solid #ffffff; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      transition: all 0.3s ease; 
      background: #000000; 
    }
    
    .distance { 
      font-size: 56px; 
      font-weight: bold; 
      color: #BEDEFF; 
    }
    
    .status { 
      font-size: 18px; 
      font-weight: 600; 
      margin: 20px 0; 
      min-height: 28px; 
      color: #ffffff;
    }
    
    .btn { 
      display: block; 
      width: 90%; 
      max-width: 320px; 
      margin: 15px auto; 
      padding: 18px; 
      font-size: 16px; 
      font-weight: bold; 
      border: none; 
      border-radius: 50px; 
      cursor: pointer; 
      transition: all 0.2s; 
    }
    
    .btn-scan { 
      background: #BEDEFF; 
      color: #000000; 
    }
    
    .btn-beep { 
      background: #ffffff; 
      color: #000000; 
    }
    
    .btn:active { 
      transform: scale(0.97); 
      opacity: 0.8; 
    }
  </style>
</head>
<body>

  <div class="radar-box" id="radarBox">
    <div class="distance" id="distText">-- m</div>

  <div class="status" id="statusText">Chưa dò tín hiệu</div>

  <button class="btn btn-beep" onclick="beepHorn()">BẤM CÒI / NHÁY ĐÈN</button>
